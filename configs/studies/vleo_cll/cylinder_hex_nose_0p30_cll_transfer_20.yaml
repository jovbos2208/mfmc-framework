models:
  hf:
    id: PICLas_TPMC_CLL
    kind: legacy_piclas
    kwargs:
      simulator_module: PICLas
      piclas_dir: piclas
      update_dir: update_parameter_file
      update_script: python update_parameter.py
      mpi_procs: 128
      piclas_mode: tpmc
      collision_mode: 0
      calc_quality_factors: false
      submission_group_size: 2
      payload_defaults:
        piclas_surface_model: 0
        piclas_surface_model_scattering: 1
        wall_temperature_k: 300.0
        t_end_s: 1.0e-4
        manual_timestep_s: 1.0e-7
        sampling_iterations: 250
  lf:
    - id: ADBSat_CLL
      kind: legacy_adbsat
      method: CLL
      kwargs:
        simulator_module: ADBSat
        base_dir: ADBSat-PyVersion
  available_qois:
    PICLas_TPMC_CLL: [C_D, C_D2]
    ADBSat_CLL: [C_D, C_D2]

qois:
  direct: [C_D, C_D2]
  derived:
